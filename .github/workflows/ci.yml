name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test Python imports
      run: |
        cd backend
        export CI=true
        python -c "print('Testing basic imports...')"
        python -c "import sys; print(f'Python version: {sys.version}')"
        python -c "import replaylist; print('RePlayList package imported successfully')"
        python -c "import main; print('Main module imported successfully')"
        echo "✅ All Python imports successful!"
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Test Frontend
      run: |
        cd frontend
        npm install
        echo "✅ Frontend dependencies installed successfully!"
    
    - name: Test Tauri
      run: |
        cd tauri
        npm install
        echo "✅ Tauri dependencies installed successfully!"
    
    - name: Verify project structure
      run: |
        echo "📁 Project structure:"
        ls -la
        echo "📁 Backend structure:"
        ls -la backend/
        echo "📁 Frontend structure:"
        ls -la frontend/
        echo "📁 Tauri structure:"
        ls -la tauri/
        echo "✅ Project structure verified!"
