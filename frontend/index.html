<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RePlayList - Transfer Playlists Between Spotify and YouTube</title>
    <link rel="icon" href="/assets/logo/ico/logo_32.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f8fafc;">
            <div style="text-align: center;">
                <img src="/assets/logo/svg/logo.svg" alt="RePlayList" style="width: 80px; height: 80px; margin-bottom: 24px;" />
                <h1 style="font-family: 'Source Sans 3', sans-serif; font-size: 2rem; font-weight: 700; color: #1e293b; margin-bottom: 16px;">
                    RePlayList
                </h1>
                <p style="font-family: 'Source Sans 3', sans-serif; font-size: 1.125rem; color: #64748b; margin-bottom: 32px;">
                    Transfer playlists between Spotify and YouTube
                </p>
                <div style="background: #f1f5f9; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <p style="font-family: 'Source Sans 3', sans-serif; color: #475569; margin: 0;">
                        🚀 Svelte frontend is ready! Start the development server with:
                    </p>
                    <code style="display: block; margin-top: 8px; padding: 8px; background: #1e293b; color: #f1f5f9; border-radius: 4px; font-family: 'Courier New', monospace;">
                        npm run dev
                    </code>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
